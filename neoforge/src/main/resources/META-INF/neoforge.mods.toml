modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
issueTrackerURL = "https://github.com/Luke100000/ImmersiveArmors/issues"
license = "GPL-3.0-only"

[[mixins]]
config = "immersive_armors.mixins.json"

[[mods]]
modId = "immersive_armors"
version = "${version}"
displayName = "Immersive Armors"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/immersive-armors"
authors = "Luke100000"
description = '''
    A lot of unique and vanilla-faithful armor sets.
    '''
logoFile = "icon.png"
itemIcon = "immersive_armors:divine_chestplate"

[[dependencies.immersive_armors]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.immersive_armors]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"
