name: Java CI with Gradle

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODRINTH_ID: ${{ secrets.MODRINTH_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_ID: ${{ secrets.CURSEFORGE_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Read release versions from tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != *"+"* ]]; then
            echo "::error::Release tag must use the format <mod-version>+<minecraft-version>"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag%%+*}" >> "${GITHUB_OUTPUT}"
          echo "game_version=${tag#*+}" >> "${GITHUB_OUTPUT}"
      - name: "Rename Fabric files"
        run: mv "fabric/build/libs/immersive_armors-${{ steps.release.outputs.tag }}.jar" "fabric/build/libs/immersive_armors-${{ steps.release.outputs.tag }}-fabric.jar"
      - name: "Rename NeoForge files"
        run: mv "neoforge/build/libs/immersive_armors-${{ steps.release.outputs.tag }}.jar" "neoforge/build/libs/immersive_armors-${{ steps.release.outputs.tag }}-neoforge.jar"
      - name: "Upload Fabric"
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          name: "[Fabric ${{ steps.release.outputs.game_version }}] Immersive Armors - ${{ steps.release.outputs.version }}"
          changelog-file: changelog.md
          version-type: release
          files: "fabric/build/libs/immersive_armors-${{ steps.release.outputs.tag }}-fabric.jar"
          loaders: |
            fabric
          environment: client | server
          game-versions: |
            ${{ steps.release.outputs.game_version }}
          java: |
            Java 21
          dependencies: |
            fabric-api
            cloth-config(recommended)

          fail-mode: skip
      - name: "Upload NeoForge"
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          name: "[NeoForge ${{ steps.release.outputs.game_version }}] Immersive Armors - ${{ steps.release.outputs.version }}"
          changelog-file: changelog.md
          version-type: release
          files: "neoforge/build/libs/immersive_armors-${{ steps.release.outputs.tag }}-neoforge.jar"
          loaders: |
            neoforge
          environment: client | server
          game-versions: |
            ${{ steps.release.outputs.game_version }}
          java: |
            Java 21

          fail-mode: skip
