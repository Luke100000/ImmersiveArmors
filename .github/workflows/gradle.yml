name: Java CI with Gradle

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MR_API_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle - Forge
        run: ./gradlew :forge:build
      - name: Build with Gradle - Fabric
        run: ./gradlew :fabric:build
      - name: Upload Artifacts - Forge
        uses: actions/upload-artifact@v7
        with:
          name: forge_artifacts
          path: ./forge/build/libs/
      - name: Upload Artifacts - Fabric
        uses: actions/upload-artifact@v7
        with:
          name: fabric_artifacts
          path: ./fabric/build/libs/
      - name: Read release versions from tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != *"+"* ]]; then
            echo "::error::Release tag must use the format <mod-version>+<minecraft-version>"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag%%+*}" >> "${GITHUB_OUTPUT}"
          echo "game_version=${tag#*+}" >> "${GITHUB_OUTPUT}"
      - name: "Rename Fabric files"
        run: mv "fabric/build/libs/immersive_armors-${{ steps.release.outputs.tag }}.jar" "fabric/build/libs/immersive_armors-${{ steps.release.outputs.tag }}-fabric.jar"
      - name: "Rename Forge files"
        run: mv "forge/build/libs/immersive_armors-${{ steps.release.outputs.tag }}.jar" "forge/build/libs/immersive_armors-${{ steps.release.outputs.tag }}-forge.jar"
      - name: "Upload Fabric"
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: eE2Db4YU
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: 580681
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          name: "[Fabric ${{ steps.release.outputs.game_version }}] Immersive Armors - ${{ steps.release.outputs.version }}"
          changelog-file: changelog.md
          version-type: release
          files: "fabric/build/libs/immersive_armors-${{ steps.release.outputs.tag }}-fabric.jar"
          loaders: |
            fabric
          environment: client | server
          game-versions: |
            ${{ steps.release.outputs.game_version }}
          java: |
            Java 17
          dependencies: |
            fabric-api | recommends | *
            cloth-config | recommends | *

          fail-mode: skip
      - name: "Upload Forge"
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: eE2Db4YU
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: 580681
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          name: "[Forge ${{ steps.release.outputs.game_version }}] Immersive Armors - ${{ steps.release.outputs.version }}"
          changelog-file: changelog.md
          version-type: release
          files: "forge/build/libs/immersive_armors-${{ steps.release.outputs.tag }}-forge.jar"
          loaders: |
            forge
          environment: client | server
          game-versions: |
            ${{ steps.release.outputs.game_version }}
          java: |
            Java 17

          fail-mode: skip
